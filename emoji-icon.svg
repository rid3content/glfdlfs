:root{
  --bg: #0e1621;
  --bg-elev: #17212b;
  --bg-elev2: #1e2a37;
  --accent: #4ea4f5;
  --accent2: #5e5ce6;
  --text: #e8eef3;
  --text-dim: #8a97a3;
  --border: #253340;
  --bubble-me: #2b5278;
  --bubble-other: #182533;
  --danger: #ff5c5c;
  --online: #34C759;
  --radius: 14px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}
#app{height:100vh;height:100dvh;width:100vw;overflow:hidden;position:relative;}

.screen{display:none;height:100%;width:100%;}
.screen.active{display:flex;}

/* ============ AUTH ============ */
#authScreen{align-items:center;justify-content:center;background:radial-gradient(circle at top, #182636, #0e1621 70%);overflow-y:auto;padding:20px 0;}
.auth-box{
  width:380px;max-width:92vw;background:var(--bg-elev);
  padding:32px 28px;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);
  text-align:center;
}
.auth-logo{width:56px;height:56px;margin-bottom:8px;}
.auth-box h1{margin:0 0 4px;font-size:24px;}
.auth-sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
.auth-tabs{display:flex;background:var(--bg-elev2);border-radius:10px;padding:4px;margin-bottom:18px;}
.auth-tab{flex:1;padding:8px;border:none;background:transparent;color:var(--text-dim);border-radius:8px;cursor:pointer;font-size:14px;transition:.15s;}
.auth-tab.active{background:var(--accent);color:#fff;}
.auth-form{display:none;flex-direction:column;gap:10px;}
.auth-form.active{display:flex;}
input, textarea{
  background:var(--bg-elev2);border:1px solid var(--border);color:var(--text);
  padding:12px 14px;border-radius:10px;font-size:16px;outline:none;width:100%;font-family:inherit;
}
input:focus, textarea:focus{border-color:var(--accent);}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;border:none;padding:12px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px;
  transition:.15s transform;
}
.btn-primary:hover{transform:translateY(-1px);}
.auth-divider{display:flex;align-items:center;color:var(--text-dim);font-size:12px;margin:16px 0;}
.auth-divider::before,.auth-divider::after{content:"";flex:1;height:1px;background:var(--border);}
.auth-divider span{padding:0 10px;}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:#fff;color:#222;border:none;padding:11px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;
}
.btn-google img{width:18px;height:18px;}
.auth-error{color:var(--danger);font-size:13px;min-height:16px;margin-top:10px;}
.privacy-note{margin-top:18px;text-align:left;font-size:12px;color:var(--text-dim);background:var(--bg-elev2);padding:10px 12px;border-radius:10px;}
.privacy-note summary{cursor:pointer;color:var(--text);font-weight:600;}
.privacy-note p{margin:8px 0 0;line-height:1.5;}

/* ============ PROFILE SETUP ============ */
#profileSetupScreen{align-items:center;justify-content:center;overflow-y:auto;padding:30px 0;}
.setup-box{
  width:420px;max-width:92vw;background:var(--bg-elev);padding:28px;border-radius:20px;
  display:flex;flex-direction:column;gap:12px;
}
.setup-box h2{margin:0;text-align:center;}
.setup-box h3{margin:12px 0 4px;font-size:14px;color:var(--text-dim);}
.avatar-upload{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:6px;}
.avatar-preview{
  width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;color:#fff;
  background-size:cover;background-position:center;overflow:hidden;
}
.avatar-upload-btn{
  display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);cursor:pointer;
}
.avatar-upload-btn img{width:16px;height:16px;filter:invert(56%) sepia(80%) saturate(400%) hue-rotate(175deg);}

.bg-picker{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:6px;}
.emoji-picker, .emoji-send-panel{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px;}
.bg-swatch{
  width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:.15s;
}
.bg-swatch.selected{border-color:#fff;transform:scale(1.08);}
.emoji-swatch{
  width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;
  display:flex;align-items:center;justify-content:center;background:var(--bg-elev2);transition:.15s;padding:6px;
}
.emoji-swatch.selected{border-color:var(--accent);}
.emoji-swatch:hover{background:var(--border);}
.emoji-svg{width:100%;height:100%;display:block;}

/* --- анимации SVG-эмодзи: у каждого из 28 эмодзи своя уникальная анимация --- */
@keyframes animFlicker{0%,100%{transform:scale(1) skewX(0deg);filter:brightness(1);}20%{transform:scale(1.05) skewX(-2deg);filter:brightness(1.15);}40%{transform:scale(.96) skewX(2deg);filter:brightness(.95);}60%{transform:scale(1.08) skewX(-1deg);filter:brightness(1.2);}80%{transform:scale(.98) skewX(1deg);filter:brightness(1);}}
@keyframes animHeartbeat{0%,100%{transform:scale(1);}14%{transform:scale(1.25);}28%{transform:scale(1);}42%{transform:scale(1.2);}70%{transform:scale(1);}}
@keyframes animTwinkle{0%,100%{transform:scale(1) rotate(0deg);opacity:1;}50%{transform:scale(1.3) rotate(15deg);opacity:.55;}}
@keyframes animLaunch{0%,100%{transform:translateY(0) rotate(-6deg) scale(1);}50%{transform:translateY(-22%) rotate(2deg) scale(1.08);}}
@keyframes animFloat{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-10%) rotate(4deg);}}
@keyframes animGlitch{0%,100%{transform:translate(0,0);}20%{transform:translate(-2px,1px);}40%{transform:translate(2px,-1px);}60%{transform:translate(-1px,-1px) scale(1.03);}80%{transform:translate(1px,1px);}}
@keyframes animConfetti{0%,100%{transform:rotate(0deg) translateY(0);}25%{transform:rotate(-12deg) translateY(-8%);}50%{transform:rotate(0deg) translateY(-14%);}75%{transform:rotate(12deg) translateY(-8%);}}
@keyframes animSteam{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-8%) rotate(-3deg);}}
@keyframes animShake{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-10deg);}75%{transform:rotate(10deg);}}
@keyframes animShimmer{0%,100%{filter:hue-rotate(0deg) saturate(1);}50%{filter:hue-rotate(45deg) saturate(1.6);}}
@keyframes animFlash{0%,100%{opacity:1;filter:brightness(1);}50%{opacity:.6;filter:brightness(1.6);}}
@keyframes animSway{0%,100%{transform:rotate(0deg);}50%{transform:rotate(14deg);}}
@keyframes animSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes animDrift{0%,100%{transform:translate(0,0);}33%{transform:translate(-6%,-8%);}66%{transform:translate(6%,-4%);}}
@keyframes animNod{0%,100%{transform:rotate(0deg);}30%{transform:rotate(-8deg);}60%{transform:rotate(4deg);}}
@keyframes animJiggle{0%,100%{transform:rotate(0deg) scale(1);}20%{transform:rotate(-6deg) scale(1.05);}40%{transform:rotate(6deg) scale(.97);}60%{transform:rotate(-4deg) scale(1.05);}80%{transform:rotate(3deg) scale(1);}}
@keyframes animGrow{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
@keyframes animBlink{0%,88%,100%{transform:scaleY(1);}94%{transform:scaleY(.15);}}
@keyframes animJolt{0%,100%{transform:translateY(0) rotate(0deg);}15%{transform:translateY(-15%) rotate(-8deg);}30%{transform:translateY(2%) rotate(6deg);}45%{transform:translateY(-6%) rotate(-3deg);}}
@keyframes animBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6%);}}
@keyframes animRumble{0%,100%{transform:translate(0,0) rotate(0deg);}20%{transform:translate(-2px,1px) rotate(-4deg);}40%{transform:translate(2px,-1px) rotate(4deg);}60%{transform:translate(-2px,-1px) rotate(-3deg);}80%{transform:translate(2px,1px) rotate(3deg);}}
@keyframes animGleam{0%,100%{transform:scale(1) rotate(0deg);filter:brightness(1);}50%{transform:scale(1.15) rotate(-4deg);filter:brightness(1.4);}}
@keyframes animSparkle{0%,100%{transform:rotate(0deg) scale(1);filter:brightness(1);}50%{transform:rotate(180deg) scale(1.1);filter:brightness(1.5);}100%{transform:rotate(360deg) scale(1);filter:brightness(1);}}
@keyframes animWiggle{0%,100%{transform:rotate(0deg);}25%{transform:rotate(-6deg);}50%{transform:rotate(0deg);}75%{transform:rotate(6deg);}}
@keyframes animRise{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-16%) rotate(3deg);}}
@keyframes animTap{0%,100%{transform:scale(1) rotate(0deg);}30%{transform:scale(1.2) rotate(-8deg);}50%{transform:scale(.95) rotate(0deg);}}
@keyframes animClapping{0%,100%{transform:scaleX(1) rotate(0deg);}50%{transform:scaleX(1.25) rotate(6deg);}}
@keyframes animFlex{0%,100%{transform:scale(1) rotate(0deg);}50%{transform:scale(1.18) rotate(-5deg);}}

.anim-flicker{animation:animFlicker 1.1s ease-in-out infinite;}
.anim-heartbeat{animation:animHeartbeat 1.4s ease-in-out infinite;}
.anim-twinkle{animation:animTwinkle 1.6s ease-in-out infinite;}
.anim-launch{animation:animLaunch 1.1s ease-in-out infinite;}
.anim-float{animation:animFloat 2.4s ease-in-out infinite;}
.anim-glitch{animation:animGlitch 0.9s steps(6) infinite;}
.anim-confetti{animation:animConfetti 1.3s ease-in-out infinite;}
.anim-steam{animation:animSteam 2.2s ease-in-out infinite;}
.anim-shake{animation:animShake 1.1s ease-in-out infinite;}
.anim-shimmer{animation:animShimmer 1.8s ease-in-out infinite;}
.anim-flash{animation:animFlash 0.9s ease-in-out infinite;}
.anim-sway{animation:animSway 2s ease-in-out infinite alternate;}
.anim-spin{animation:animSpin 3s linear infinite;}
.anim-drift{animation:animDrift 3.2s ease-in-out infinite;}
.anim-nod{animation:animNod 1.4s ease-in-out infinite;}
.anim-jiggle{animation:animJiggle 0.9s ease-in-out infinite;}
.anim-grow{animation:animGrow 1.2s ease-in-out infinite;}
.anim-blink{animation:animBlink 2.6s ease-in-out infinite;}
.anim-jolt{animation:animJolt 1.3s ease-in-out infinite;}
.anim-bob{animation:animBob 2.6s ease-in-out infinite;}
.anim-rumble{animation:animRumble 0.6s ease-in-out infinite;}
.anim-gleam{animation:animGleam 1.5s ease-in-out infinite;}
.anim-sparkle{animation:animSparkle 2.4s ease-in-out infinite;}
.anim-wiggle{animation:animWiggle 1.2s ease-in-out infinite;}
.anim-rise{animation:animRise 2.8s ease-in-out infinite;}
.anim-tap{animation:animTap 1.1s ease-in-out infinite;}
.anim-clapping{animation:animClapping 0.7s ease-in-out infinite;}
.anim-flex{animation:animFlex 1.3s ease-in-out infinite;}

/* --- общие UI-анимации: переходы экранов, модалок, сообщений, кнопок --- */
@keyframes screenFadeIn{from{opacity:0;transform:scale(.98);}to{opacity:1;transform:scale(1);}}
.screen.active{animation:screenFadeIn .35s ease;}

@keyframes modalPopIn{from{opacity:0;transform:scale(.9) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
@keyframes modalBackdropIn{from{opacity:0;}to{opacity:1;}}
.modal:not(.hidden){animation:modalBackdropIn .2s ease;}
.modal:not(.hidden) .modal-content{animation:modalPopIn .28s cubic-bezier(.2,.8,.3,1.2);}

@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
.msg{animation:bubbleIn .22s ease;}
.msg.msg-new{animation:bubbleIn .3s cubic-bezier(.2,.8,.3,1.15);}

@keyframes listItemIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.contact-item{animation:listItemIn .25s ease;}

.icon-btn, .btn-primary, .btn-secondary, .btn-google, .send-btn, .tab-btn, .auth-tab{
  transition:transform .12s ease, background-color .15s ease, box-shadow .15s ease;
}
.icon-btn:active, .send-btn:active, .btn-primary:active, .btn-secondary:active, .btn-google:active{transform:scale(.9);}
.send-btn{transition:transform .15s cubic-bezier(.34,1.56,.64,1), background-color .15s ease;}
.send-btn:hover{transform:scale(1.08);}

@keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.55);}70%{box-shadow:0 0 0 6px rgba(52,199,89,0);}}
.online-dot{animation:dotPulse 2s ease-in-out infinite;}

.bg-swatch, .emoji-swatch{transition:transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s ease;}
.bg-swatch:hover{transform:scale(1.1);}
.emoji-swatch:hover{transform:scale(1.12) rotate(-3deg);}

@keyframes avatarPop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}
.avatar-small, .avatar-big, .avatar-preview{animation:avatarPop .3s cubic-bezier(.2,.8,.3,1.2);}

#chatWindow, #sidebar{transition:transform .25s ease;}

@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:.5;}30%{transform:translateY(-4px);opacity:1;}}
.typing-dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text-dim);margin-right:3px;animation:typingDot 1.2s ease-in-out infinite;}
.typing-dot:nth-child(2){animation-delay:.15s;}
.typing-dot:nth-child(3){animation-delay:.3s;}

/* ============ MAIN CHAT SCREEN ============ */
#mainScreen{width:100%;height:100%;position:relative;}
#sidebar{
  width:320px;min-width:280px;background:var(--bg-elev);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
}
.sidebar-header{display:flex;align-items:center;gap:8px;padding:14px;border-bottom:1px solid var(--border);}
.my-avatar-wrap{position:relative;width:38px;height:38px;flex-shrink:0;cursor:pointer;}
.avatar-small{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;
  background-size:cover;background-position:center;overflow:hidden;flex-shrink:0;position:relative;
}
.emoji-status-badge{
  position:absolute;bottom:-3px;right:-3px;background:var(--bg-elev);border-radius:50%;
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:2px;
}
.emoji-status-badge img{width:100%;height:100%;}
.online-dot{
  position:absolute;bottom:0;right:0;width:11px;height:11px;border-radius:50%;
  background:var(--online);border:2px solid var(--bg-elev);
}
.sidebar-title{flex:1;font-weight:700;font-size:16px;}
.icon-btn{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:6px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--bg-elev2);color:var(--text);}
.icon-btn img{width:20px;height:20px;filter:invert(64%) sepia(9%) saturate(500%);}
.search-input{margin:10px 14px;width:calc(100% - 28px);}
.chats-empty{padding:20px 16px;text-align:center;color:var(--text-dim);font-size:13px;display:none;}
.chats-empty.show{display:block;}
.contacts-list{flex:1;overflow-y:auto;}
.contact-item{
  display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:.1s;border-left:3px solid transparent;
}
.contact-item:hover{background:var(--bg-elev2);}
.contact-item.active{background:var(--bg-elev2);border-left-color:var(--accent);}
.contact-name{font-weight:600;font-size:14px;}
.contact-username, .contact-preview{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.contact-text-wrap{overflow:hidden;flex:1;min-width:0;}
.contact-name-row{display:flex;align-items:center;gap:6px;}
.contact-name-row .emoji-svg{width:16px;height:16px;}
.group-avatar-icon{font-size:16px;}

#chatWindow{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;}
.chat-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);gap:14px;
}
.chat-empty-logo{width:60px;height:60px;opacity:.4;}
.chat-active{flex:1;display:flex;flex-direction:column;height:100%;min-height:0;}
.chat-active.hidden, .chat-empty.hidden{display:none;}
.chat-header{
  display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--bg-elev);
}
.chat-header-info{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;min-width:0;}
.chat-header-info .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
.chat-header-info .username{font-size:12px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.back-btn{display:none;font-size:20px;}

.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch;}
.msg{max-width:60%;padding:9px 14px;border-radius:16px;font-size:14px;line-height:1.4;position:relative;word-wrap:break-word;}
.msg-me{align-self:flex-end;background:var(--bubble-me);border-bottom-right-radius:4px;}
.msg-other{align-self:flex-start;background:var(--bubble-other);border-bottom-left-radius:4px;}
.msg-sender{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:2px;}
.msg-time{font-size:10px;color:var(--text-dim);margin-top:3px;text-align:right;}
.msg-image{padding:4px;background:transparent;}
.msg-image img{max-width:240px;max-height:320px;border-radius:12px;display:block;}
.msg-emoji{background:transparent;padding:0;max-width:none;}
.msg-emoji .emoji-svg{width:64px;height:64px;}

.emoji-send-panel{padding:12px 18px;background:var(--bg-elev);border-top:1px solid var(--border);max-height:220px;overflow-y:auto;}
.emoji-send-panel.hidden{display:none;}
.emoji-send-panel .emoji-swatch{padding:8px;}

.message-form{display:flex;align-items:center;gap:6px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg-elev);}
.message-form input{flex:1;border-radius:20px;}
.attach-btn{flex-shrink:0;}
.attach-btn img{width:22px;height:22px;}
.send-btn{
  background:var(--accent);border:none;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.send-btn img{width:18px;height:18px;filter:invert(1);}

/* ============ MODAL / PROFILE VIEW ============ */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal.hidden{display:none;}
.modal-content{
  width:400px;max-width:92vw;max-height:88vh;overflow-y:auto;background:var(--bg-elev);border-radius:18px;padding:0 0 20px;position:relative;
}
.profile-banner{
  height:130px;border-radius:18px 18px 0 0;position:relative;display:flex;align-items:flex-end;padding:16px;
}
.profile-banner .avatar-big{
  width:84px;height:84px;border-radius:50%;border:4px solid var(--bg-elev);background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;
  background-size:cover;background-position:center;overflow:hidden;
}
.profile-close{position:absolute;top:10px;right:12px;background:rgba(0,0,0,.35);border:none;color:#fff;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:16px;z-index:2;}
.profile-info{padding:16px;}
.profile-name-row{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700;}
.profile-name-row .emoji-svg{width:22px;height:22px;}
.profile-username{color:var(--text-dim);font-size:13px;margin-top:2px;}
.profile-online{color:var(--online);font-size:12px;margin-top:4px;}
.profile-bio{margin-top:12px;font-size:14px;line-height:1.5;color:var(--text);}
.profile-actions{padding:0 16px;display:flex;gap:10px;margin-top:10px;}
.profile-actions button{flex:1;}
.btn-secondary{background:var(--bg-elev2);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:10px;cursor:pointer;font-size:13px;}

/* ============ НОВЫЙ ЧАТ / ГРУППА ============ */
#newChatContent{padding:20px;}
.new-chat-tabs{display:flex;background:var(--bg-elev2);border-radius:10px;padding:4px;margin-bottom:14px;}
.tab-btn{flex:1;padding:8px;border:none;background:transparent;color:var(--text-dim);border-radius:8px;cursor:pointer;font-size:14px;transition:.15s;}
.tab-btn.active{background:var(--accent);color:#fff;}
.new-chat-tab{display:none;flex-direction:column;gap:8px;}
.new-chat-tab.active{display:flex;}
.new-chat-tab h3{margin:8px 0 2px;font-size:13px;color:var(--text-dim);}
.selected-members{display:flex;flex-wrap:wrap;gap:6px;}
.member-chip{
  background:var(--accent);color:#fff;font-size:12px;padding:5px 10px;border-radius:14px;display:flex;align-items:center;gap:6px;
}
.member-chip button{background:none;border:none;color:#fff;cursor:pointer;font-size:12px;padding:0;}

.section-title{padding:16px 16px 0;font-size:13px;color:var(--text-dim);font-weight:600;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

/* ============ МОБИЛЬНАЯ ВЁРСТКА ============ */
@media (max-width: 760px){
  #mainScreen{display:flex;overflow:hidden;}
  #sidebar{
    width:100%;min-width:0;position:absolute;inset:0;z-index:2;
    transition:transform .25s ease;
  }
  #chatWindow{
    width:100%;position:absolute;inset:0;z-index:1;
    transform:translateX(100%);transition:transform .25s ease;
  }
  #app.chat-open #sidebar{transform:translateX(-100%);}
  #app.chat-open #chatWindow{transform:translateX(0);}
  .back-btn{display:flex;}

  .auth-box, .setup-box{width:100%;border-radius:0;min-height:100%;padding:24px 18px;}
  #authScreen, #profileSetupScreen{padding:0;}

  .msg{max-width:80%;}
  .msg-image img{max-width:70vw;}
  .modal-content{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;}
  .bg-picker{grid-template-columns:repeat(6,1fr);}
  .emoji-picker, .emoji-send-panel{grid-template-columns:repeat(5,1fr);}
  .sidebar-title{font-size:15px;}
  .message-form input{font-size:16px;}
}

@media (max-width: 400px){
  .bg-picker{grid-template-columns:repeat(5,1fr);}
  .emoji-picker, .emoji-send-panel{grid-template-columns:repeat(4,1fr);}
}
