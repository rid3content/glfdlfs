<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-950 select-none overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RID3 Cyber Defender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fira Code', monospace;
            touch-action: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #050811;
        }
        .glow-cyan {
            filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.6));
        }
        .glow-pink {
            filter: drop-shadow(0 0 8px rgba(244, 114, 182, 0.6));
        }
    </style>
</head>
<body class="h-full w-full flex flex-col bg-slate-950 text-slate-100 relative font-mono overflow-hidden">

    <!-- Top HUD Bar -->
    <div id="hud-bar" class="absolute top-0 left-0 right-0 p-3 flex justify-between items-center z-10 pointer-events-none bg-gradient-to-b from-slate-950/80 to-transparent">
        <div class="flex items-center space-x-4">
            <div>
                <div class="text-[10px] text-slate-400 uppercase tracking-widest">Счет</div>
                <div id="score-val" class="text-xl font-bold text-cyan-400 glow-cyan">000000</div>
            </div>
            <div>
                <div class="text-[10px] text-slate-400 uppercase tracking-widest">Рекорд</div>
                <div id="highscore-val" class="text-xl font-bold text-amber-400">000000</div>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div>
                <div class="text-[10px] text-slate-400 uppercase tracking-widest text-right">Волна</div>
                <div id="wave-val" class="text-lg font-bold text-purple-400 text-right">1</div>
            </div>
            <!-- Health Bar -->
            <div class="w-28 sm:w-36">
                <div class="text-[10px] text-slate-400 uppercase tracking-widest text-right">Прочность</div>
                <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden border border-slate-700 mt-0.5">
                    <div id="hp-bar" class="bg-gradient-to-r from-red-500 via-amber-400 to-emerald-400 h-full w-full transition-all duration-300"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Game Canvas Container -->
    <div class="relative flex-1 w-full h-full">
        <canvas id="gameCanvas"></canvas>

        <!-- Start / Game Over Overlay Modal -->
        <div id="modal-overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md flex flex-col items-center justify-center p-6 z-20 transition-opacity duration-300">
            <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center shadow-2xl space-y-5">
                <div class="space-y-1">
                    <h1 id="modal-title" class="text-2xl font-bold text-cyan-400 tracking-wider glow-cyan uppercase">RID3 CYBER DEFENDER</h1>
                    <p id="modal-subtitle" class="text-xs text-slate-400">Отразите атаку автономных вирусов в RID3 OS</p>
                </div>

                <div id="stats-container" class="hidden bg-slate-950/60 p-4 rounded-xl border border-slate-800 space-y-2 text-sm">
                    <div class="flex justify-between"><span class="text-slate-400">Набранные очки:</span><span id="final-score" class="font-bold text-cyan-400">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Уничтожено вирусов:</span><span id="final-kills" class="font-bold text-emerald-400">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Пройдено волн:</span><span id="final-waves" class="font-bold text-purple-400">0</span></div>
                </div>

                <div class="text-xs text-slate-400 space-y-1 text-left bg-slate-950/40 p-3 rounded-lg border border-slate-800/80">
                    <div class="font-semibold text-slate-300 mb-1">Управление:</div>
                    <div>• <span class="text-cyan-400">WASD</span> или <span class="text-cyan-400">Стрелки</span> — Перемещение</div>
                    <div>• <span class="text-cyan-400">Пробел</span> — Стрельба</div>
                    <div>• <span class="text-cyan-400">E</span> — Взрыв EMP бомбы</div>
                </div>

                <button id="start-btn" onclick="startGame()" class="w-full py-3 bg-gradient-to-r from-cyan-600 to-indigo-600 hover:from-cyan-500 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg hover:shadow-cyan-500/25 transition active:scale-95">
                    ИГРАТЬ
                </button>
            </div>
        </div>

        <!-- Touch Controls overlay for Mobile/Touch Window -->
        <div id="touch-controls" class="absolute bottom-4 left-4 right-4 flex justify-between items-end z-10 opacity-70 pointer-events-auto sm:hidden">
            <div id="dpad" class="grid grid-cols-3 gap-1 w-32 h-32 bg-slate-900/60 p-1 rounded-2xl border border-slate-800 backdrop-blur">
                <div></div>
                <button ontouchstart="setKey('ArrowUp', true)" ontouchend="setKey('ArrowUp', false)" class="bg-slate-800 active:bg-cyan-600 rounded-lg text-xs flex items-center justify-center">▲</button>
                <div></div>
                <button ontouchstart="setKey('ArrowLeft', true)" ontouchend="setKey('ArrowLeft', false)" class="bg-slate-800 active:bg-cyan-600 rounded-lg text-xs flex items-center justify-center">◄</button>
                <div class="bg-slate-950 rounded-lg"></div>
                <button ontouchstart="setKey('ArrowRight', true)" ontouchend="setKey('ArrowRight', false)" class="bg-slate-800 active:bg-cyan-600 rounded-lg text-xs flex items-center justify-center">►</button>
                <div></div>
                <button ontouchstart="setKey('ArrowDown', true)" ontouchend="setKey('ArrowDown', false)" class="bg-slate-800 active:bg-cyan-600 rounded-lg text-xs flex items-center justify-center">▼</button>
                <div></div>
            </div>

            <div class="flex flex-col gap-2">
                <button ontouchstart="setKey('KeyE', true)" ontouchend="setKey('KeyE', false)" class="w-14 h-14 bg-purple-600/80 active:bg-purple-500 text-white rounded-full font-bold text-xs shadow-lg flex items-center justify-center border border-purple-400">
                    EMP
                </button>
                <button ontouchstart="setKey('Space', true)" ontouchend="setKey('Space', false)" class="w-16 h-16 bg-cyan-600/80 active:bg-cyan-500 text-white rounded-full font-bold text-xs shadow-lg flex items-center justify-center border border-cyan-400">
                    FIRE
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * STREAMING_CHUNK: Audio Synthesizer Engine using Web Audio API...
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
            }

            playLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            playExplosion() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.25);
            }
        }

        const sound = new SoundEngine();

        /**
         * STREAMING_CHUNK: Game State Variables & RID3 OS Storage Integration...
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let isRunning = false;
        let score = 0;
        let highScore = 0;
        let wave = 1;
        let killsCount = 0;
        let empCount = 1;
        let isRVA = false;

        const keys = {};

        // RID3 OS Bridge Listener
        window.addEventListener('rva-ready', async () => {
            isRVA = true;
            try {
                if (window.RVA && window.RVA.storage) {
                    const savedScore = await window.RVA.storage.get('defender_highscore');
                    if (savedScore) {
                        highScore = parseInt(savedScore, 10) || 0;
                        document.getElementById('highscore-val').textContent = String(highScore).padStart(6, '0');
                    }
                }
            } catch (e) {
                console.warn('Storage permission missing or limited:', e);
            }
        });

        // Fallback localStorage highscore
        if (!isRVA) {
            highScore = parseInt(localStorage.getItem('rid3_defender_highscore') || '0', 10);
            document.getElementById('highscore-val').textContent = String(highScore).padStart(6, '0');
        }

        function setKey(code, state) {
            keys[code] = state;
        }

        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'KeyE' && isRunning) triggerEMP();
        });

        window.addEventListener('keyup', e => keys[e.code] = false);

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * STREAMING_CHUNK: Player, Bullet, Enemy and Particle Classes...
         */
        class Player {
            constructor() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 80;
                this.size = 20;
                this.speed = 6;
                this.hp = 100;
                this.maxHp = 100;
                this.weaponLevel = 1;
                this.lastShot = 0;
                this.shootDelay = 150;
            }

            update() {
                if ((keys['ArrowLeft'] || keys['KeyA']) && this.x > this.size) this.x -= this.speed;
                if ((keys['ArrowRight'] || keys['KeyD']) && this.x < canvas.width - this.size) this.x += this.speed;
                if ((keys['ArrowUp'] || keys['KeyW']) && this.y > this.size + 40) this.y -= this.speed;
                if ((keys['ArrowDown'] || keys['KeyS']) && this.y < canvas.height - this.size) this.y += this.speed;

                if (keys['Space'] && performance.now() - this.lastShot > this.shootDelay) {
                    this.shoot();
                    this.lastShot = performance.now();
                }
            }

            shoot() {
                sound.playLaser();
                if (this.weaponLevel === 1) {
                    bullets.push(new Bullet(this.x, this.y - 15, 0, -12));
                } else if (this.weaponLevel === 2) {
                    bullets.push(new Bullet(this.x - 10, this.y - 15, 0, -12));
                    bullets.push(new Bullet(this.x + 10, this.y - 15, 0, -12));
                } else {
                    bullets.push(new Bullet(this.x, this.y - 15, 0, -12));
                    bullets.push(new Bullet(this.x - 12, this.y - 10, -2, -11));
                    bullets.push(new Bullet(this.x + 12, this.y - 10, 2, -11));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Ship Hull
                ctx.beginPath();
                ctx.moveTo(0, -this.size);
                ctx.lineTo(this.size, this.size);
                ctx.lineTo(0, this.size * 0.6);
                ctx.lineTo(-this.size, this.size);
                ctx.closePath();
                ctx.fillStyle = '#06b6d4';
                ctx.fill();
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Thruster Flame
                ctx.beginPath();
                ctx.moveTo(-6, this.size * 0.7);
                ctx.lineTo(0, this.size * 0.7 + Math.random() * 12 + 6);
                ctx.lineTo(6, this.size * 0.7);
                ctx.fillStyle = '#f43f5e';
                ctx.fill();

                ctx.restore();
            }
        }

        class Bullet {
            constructor(x, y, vx, vy) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.radius = 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        class Enemy {
            constructor(wave) {
                this.radius = Math.random() * 10 + 12;
                this.x = Math.random() * (canvas.width - this.radius * 2) + this.radius;
                this.y = -this.radius;
                this.speed = Math.random() * 1.5 + 1 + wave * 0.2;
                this.hp = Math.floor(wave * 0.8) + 1;
                this.maxHp = this.hp;
                this.color = ['#f43f5e', '#a855f7', '#eab308'][Math.floor(Math.random() * 3)];
            }

            update() {
                this.y += this.speed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let lastSpawn = 0;

        /**
         * STREAMING_CHUNK: Game Loop and Logic...
         */
        function triggerEMP() {
            if (empCount <= 0 || !isRunning) return;
            empCount--;
            sound.playExplosion();

            enemies.forEach(e => {
                for (let i = 0; i < 12; i++) particles.push(new Particle(e.x, e.y, '#a855f7'));
                score += 100;
                killsCount++;
            });
            enemies = [];

            // EMP Visual Flash
            ctx.fillStyle = 'rgba(168, 85, 247, 0.4)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function spawnEnemies() {
            const now = performance.now();
            const spawnInterval = Math.max(400, 1500 - wave * 100);
            if (now - lastSpawn > spawnInterval) {
                enemies.push(new Enemy(wave));
                lastSpawn = now;
            }
        }

        function gameLoop() {
            if (!isRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Stars / Cyber Grid background
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
            ctx.lineWidth = 1;
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Player logic
            player.update();
            player.draw();

            // Bullets logic
            bullets.forEach((b, index) => {
                b.update();
                b.draw();
                if (b.y < -10 || b.x < 0 || b.x > canvas.width) bullets.splice(index, 1);
            });

            // Enemies logic
            spawnEnemies();
            enemies.forEach((enemy, eIndex) => {
                enemy.update();
                enemy.draw();

                // Collision with player
                const distToPlayer = Math.hypot(enemy.x - player.x, enemy.y - player.y);
                if (distToPlayer < enemy.radius + player.size) {
                    player.hp -= 20;
                    document.getElementById('hp-bar').style.width = `${Math.max(0, player.hp)}%`;
                    sound.playExplosion();
                    enemies.splice(eIndex, 1);

                    if (player.hp <= 0) {
                        endGame();
                    }
                }

                // Collision with bullets
                bullets.forEach((b, bIndex) => {
                    const distToBullet = Math.hypot(enemy.x - b.x, enemy.y - b.y);
                    if (distToBullet < enemy.radius + b.radius) {
                        enemy.hp--;
                        bullets.splice(bIndex, 1);

                        if (enemy.hp <= 0) {
                            sound.playExplosion();
                            for (let i = 0; i < 8; i++) particles.push(new Particle(enemy.x, enemy.y, enemy.color));
                            score += 150;
                            killsCount++;

                            // Upgrade weapon every 15 kills
                            if (killsCount % 15 === 0 && player.weaponLevel < 3) {
                                player.weaponLevel++;
                                sound.playPowerup();
                            }

                            // Advance wave every 20 kills
                            if (killsCount % 20 === 0) {
                                wave++;
                                document.getElementById('wave-val').textContent = wave;
                            }

                            document.getElementById('score-val').textContent = String(score).padStart(6, '0');
                            enemies.splice(eIndex, 1);
                        }
                    }
                });

                // Enemy reached bottom
                if (enemy.y > canvas.height + enemy.radius) {
                    player.hp -= 10;
                    document.getElementById('hp-bar').style.width = `${Math.max(0, player.hp)}%`;
                    enemies.splice(eIndex, 1);
                    if (player.hp <= 0) endGame();
                }
            });

            // Particles logic
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(gameLoop);
        }

        /**
         * STREAMING_CHUNK: Start & End Game Handlers...
         */
        function startGame() {
            sound.init();
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            wave = 1;
            killsCount = 0;
            empCount = 1;
            isRunning = true;

            document.getElementById('score-val').textContent = '000000';
            document.getElementById('wave-val').textContent = '1';
            document.getElementById('hp-bar').style.width = '100%';
            document.getElementById('modal-overlay').classList.add('opacity-0', 'pointer-events-none');

            requestAnimationFrame(gameLoop);
        }

        async function endGame() {
            isRunning = false;
            sound.playExplosion();

            if (score > highScore) {
                highScore = score;
                document.getElementById('highscore-val').textContent = String(highScore).padStart(6, '0');

                // Save to RID3 Storage API if available
                if (isRVA && window.RVA && window.RVA.storage) {
                    try {
                        await window.RVA.storage.set('defender_highscore', highScore);
                    } catch (e) {}
                } else {
                    localStorage.setItem('rid3_defender_highscore', highScore);
                }

                // Send system notification in RID3 OS
                if (isRVA && window.RVA && window.RVA.notify) {
                    try {
                        await window.RVA.notify(`Новый рекорд в Cyber Defender: ${highScore} очков!`);
                    } catch (e) {}
                }
            }

            document.getElementById('modal-title').textContent = "СИСТЕМА ВЗЛОМАНА";
            document.getElementById('modal-subtitle').textContent = "Вирусы преодолели защитный периметр";
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-kills').textContent = killsCount;
            document.getElementById('final-waves').textContent = wave;
            document.getElementById('stats-container').classList.remove('hidden');
            document.getElementById('start-btn').textContent = "ПОПРОБОВАТЬ СНОВА";

            document.getElementById('modal-overlay').classList.remove('opacity-0', 'pointer-events-none');
        }
    </script>
</body>
</html>
