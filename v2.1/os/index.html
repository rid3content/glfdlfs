<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>RID3 OS v2</title>
<meta name="description" content="RID3 OS — веб-операционная система на чистом HTML/CSS/JS с IDE и правами доступа приложений.">
<meta name="theme-color" content="#0B0E14">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RID3 OS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/desktop.css">
<link rel="stylesheet" href="css/windows.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/animations.css">
</head>
<body>

<!-- Экран загрузки ОС -->
<div id="boot-screen">
  <div class="boot-ring"></div>
  <div class="boot-label">RID3<span>OS</span></div>
  <div class="boot-status" id="boot-status">инициализация ядра…</div>
</div>

<!-- Рабочий стол -->
<div id="desktop" class="hidden">

  <div id="wallpaper"></div>

  <!-- Иконки рабочего стола -->
  <div id="desktop-icons"></div>

  <!-- Контейнер окон -->
  <div id="window-layer"></div>

  <!-- Стартовое меню -->
  <div id="start-menu" class="closed">
    <div class="start-header">
      <div class="start-user">
        <div class="start-avatar">R</div>
        <div>
          <div class="start-username">Пользователь</div>
          <div class="start-sub">RID3 OS v2</div>
        </div>
      </div>
      <input type="text" id="start-search" placeholder="Поиск приложений и файлов…">
    </div>
    <div class="start-grid" id="start-grid"></div>
    <div class="start-footer">
      <button class="start-action" data-action="install-app">⬆ Установить .rva</button>
      <button class="start-action" data-action="open-files">🗂 Файлы</button>
      <button class="start-action" data-action="open-settings">⚙ Настройки</button>
      <button class="start-action" data-action="open-ide">🧑‍💻 IDE</button>
    </div>
  </div>

  <!-- Панель задач -->
  <div id="taskbar">
    <button id="start-btn" title="Пуск">
      <span class="rid3-glyph"></span>
    </button>
    <div id="taskbar-apps"></div>
    <div id="taskbar-right">
      <div id="pulse" title="Системный пульс">
        <span class="pulse-ring"></span>
        <span class="pulse-count" id="pulse-count">0</span>
      </div>
      <div id="clock"></div>
    </div>
  </div>

</div>

<!-- Модальные окна (ошибки, предупреждения, диалоги) -->
<div id="modal-layer"></div>

<!-- Скрытый инпут для установки .rva приложений -->
<input type="file" id="rva-file-input" multiple hidden>
<input type="file" id="rva-folder-input" webkitdirectory directory multiple hidden>

<script src="lib/boot-loader.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="js/fs.js"></script>
<script src="js/permissions.js"></script>
<script src="js/manifest.js"></script>
<script src="js/resources.js"></script>
<script src="js/icon-library.js"></script>
<script src="js/icon.js"></script>
<script src="js/contextmenu.js"></script>
<script src="js/bridge.js"></script>
<script src="js/apps.js"></script>
<script src="js/windows.js"></script>
<script src="js/settings.js"></script>
<script src="js/filemanager.js"></script>
<script src="js/ide.js"></script>
<script src="js/export.js"></script>
<script src="js/os.js"></script>
</body>
</html>
